<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credence Group LLC — Camp locations</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
html,body,#map{margin:0;height:100%;background:#e5e3df}
.leaflet-tile-pane{filter:saturate(0.6) brightness(1.06) contrast(0.92)}
.leaflet-container{font-family:Inter,system-ui,sans-serif}
.leaflet-control-attribution{background:rgba(255,255,255,0.8)!important;color:#5f6368!important}
.leaflet-control-attribution a{color:#1a73e8!important}
.leaflet-control-zoom a{background:#fff!important;color:#5f6368!important;border-color:#dadce0!important}
.pin{position:relative;width:18px;height:18px}
.pin span{position:absolute;inset:0;border-radius:50%;background:#1a73e8;box-shadow:0 0 0 3px #fff,0 2px 10px rgba(0,0,0,0.35)}
.pin i{position:absolute;inset:-10px;border-radius:50%;border:2px solid #1a73e8;opacity:0;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(0.4);opacity:0.9}100%{transform:scale(1.6);opacity:0}}
.lbl{background:#fff!important;color:#202124!important;border:1px solid #dadce0!important;border-radius:8px!important;box-shadow:0 2px 6px rgba(60,64,67,0.3)!important;font-size:13px;font-weight:500;padding:6px 10px!important}
.lbl:before{display:none}
</style>
</head>
<body>
<div id="map"></div>
<script>
const camps=[
  {name:'Al Quoz',ll:[25.135,55.235],dir:'right'},
  {name:'DIP',ll:[24.985,55.165],dir:'bottom'},
  {name:'Jebel Ali',ll:[25.005,55.105],dir:'top'},
  {name:'Sonapur',ll:[25.265,55.44],dir:'left'}
];
const off={right:[12,0],left:[-12,0],top:[0,-12],bottom:[0,12]};
const map=L.map('map',{scrollWheelZoom:false,zoomControl:true,attributionControl:true});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
const icon=L.divIcon({className:'',html:'<div class="pin"><i></i><span></span></div>',iconSize:[18,18],iconAnchor:[9,9]});
const pts=camps.map(c=>{L.marker(c.ll,{icon}).addTo(map).bindTooltip(c.name,{permanent:true,direction:c.dir,offset:off[c.dir],className:'lbl'});return c.ll;});
map.setView([25.1,55.25],10);
function fit(){const el=document.getElementById('map');if(el.clientWidth<50||el.clientHeight<50)return;map.invalidateSize();const p=Math.min(60,el.clientWidth*0.14);map.fitBounds(pts,{paddingTopLeft:[p,p],paddingBottomRight:[p,p+10],maxZoom:12});}
new ResizeObserver(fit).observe(document.getElementById('map'));
window.addEventListener('resize',fit);window.addEventListener('load',fit);
requestAnimationFrame(fit);setTimeout(fit,300);
</script>
</body>
</html>
